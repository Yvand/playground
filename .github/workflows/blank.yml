name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  reject-zip-files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Reject pull requests containing zip files
        uses: actions/github-script@v8
        with:
          script: |
            const pullRequest = context.payload.pull_request;

            if (!pullRequest) {
              core.info('No pull request payload found. Skipping zip file check.');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });

            const zipFiles = files
              .map((file) => file.filename)
              .filter((filename) => filename.toLowerCase().endsWith('.zip'));

            if (zipFiles.length > 0) {
              core.setFailed([
                'Zip files are not allowed in pull requests.',
                ...zipFiles,
              ].join('\n'));
              return;
            }

            core.info('No zip files detected in pull request changes.');
            



      

